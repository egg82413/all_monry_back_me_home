<head>

  <title>鍾老師要看 Dashboard</title>
  <style>

    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, "Microsoft JhengHei", sans-serif; background: var(--bg); color: var(--text); letter-spacing: 0; }
    header { display: grid; grid-template-columns: minmax(220px, 320px) minmax(520px, 1fr) minmax(360px, auto); gap: 14px; align-items: center; padding: 14px 18px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 2; backdrop-filter: blur(8px); }
    .brand { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .brand-title { font-size: 18px; font-weight: 800; }
    .brand-subtitle { color: var(--muted); font-size: 12px; }
    .mobile-title { display: none; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; }
    select, input, button { height: 34px; border: 1px solid #c8d0dc; border-radius: 7px; background: #fff; padding: 0 9px; color: var(--text); font-size: 13px; }
    select { min-width: 128px; }
    button { cursor: pointer; font-weight: 650; }
    button:hover { border-color: #8ea4c2; }
    button.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .nav-button { display: inline-flex; align-items: center; height: 34px; border: 1px solid #c8d0dc; border-radius: 7px; background: #fff; padding: 0 9px; color: var(--text); font-size: 13px; font-weight: 650; text-decoration: none; }
    .nav-button:hover { border-color: #8ea4c2; }
    main { padding: 16px 18px; }
    .grid { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: 16px; align-items: start; }
    .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; position: relative; box-shadow: 0 8px 22px rgba(15,23,42,.04); }
    .info-panel { margin-bottom: 16px; }
    .summary-panel { position: sticky; top: 76px; }
    h3 { margin: 0 0 8px; font-size: 18px; line-height: 1.25; }
    .chart-panel { min-width: 0; }
    .indicator-bar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; align-items: center; padding-top: 2px; }
    .chart-tools { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #edf0f4; }
    .icon-button { min-width: 36px; height: 32px; border: 1px solid #c9d1dc; border-radius: 7px; background: #fff; cursor: pointer; font-size: 16px; line-height: 1; }
    .range-bar { position: relative; height: 34px; margin: 2px 2px 8px; }
    .range-track { position: absolute; left: 0; right: 0; top: 14px; height: 6px; background: #e3e8ef; border-radius: 999px; }
    .range-window { position: absolute; top: 14px; height: 6px; background: var(--blue); border-radius: 999px; }
    .range-handle { position: absolute; top: 5px; width: 18px; height: 24px; border: 2px solid var(--blue); border-radius: 6px; background: #fff; cursor: ew-resize; transform: translateX(-50%); box-shadow: 0 2px 8px rgba(31,111,235,.2); }
    .range-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .axis-range { margin-top: 8px; padding-top: 8px; border-top: 1px solid #edf0f4; }
    .indicator { display: inline-flex; align-items: center; gap: 5px; height: 29px; padding: 0 8px; border: 1px solid #d9dee7; border-radius: 999px; font-size: 12px; background: #fff; cursor: pointer; }
    .indicator:hover { border-color: #9aabc2; }
    .indicator input { height: auto; margin: 0; }
    .indicator-dot { width: 9px; height: 9px; border-radius: 999px; display: inline-block; }
    .metric { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 8px 0; border-bottom: 1px solid #edf0f4; font-size: 13px; }
    .metric strong { font-size: 13px; }
    .metric:last-child { border-bottom: 0; }
    .fundamentals { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 7px 14px; margin: 10px 0 0; padding: 10px; border: 1px solid #edf0f4; border-radius: 8px; background: #fbfcfe; }
    .section-title { font-size: 13px; font-weight: 800; margin-bottom: 2px; }
    .info-row { display: grid; grid-template-columns: 86px 1fr; gap: 8px; font-size: 12px; line-height: 1.35; }
    .info-row span:first-child { color: var(--muted); }
    .info-row a { color: var(--blue); text-decoration: none; word-break: break-all; }
    .rule-panel { border: 1px solid #edf0f4; border-radius: 8px; padding: 10px; margin: 12px 0 0; background: #fbfcfe; }
    .rule-title { font-size: 13px; font-weight: 800; margin-bottom: 8px; }
    .rule-grid { display: grid; gap: 6px; }
    .mobile-tabs { display: none; }
    .rule-option { display: grid; grid-template-columns: 16px 1fr auto; gap: 7px; align-items: center; font-size: 12px; }
    .rule-option input { height: auto; margin: 0; }
    .rule-tag { font-size: 11px; border-radius: 999px; padding: 2px 6px; background: #eef2f7; color: #46556b; }
    .data-panel { display: grid; gap: 10px; margin: 10px 0 12px; }
    .data-card { border: 1px solid #edf0f4; border-radius: 8px; background: #fbfcfe; overflow: hidden; }
    .data-card-title { display: flex; justify-content: space-between; gap: 8px; padding: 8px 9px; font-size: 13px; font-weight: 800; background: #f8fafc; border-bottom: 1px solid #edf0f4; }
    .data-card-title span:last-child { color: var(--muted); font-weight: 600; font-size: 12px; }
    .data-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; padding: 7px 9px; border-bottom: 1px solid #edf0f4; font-size: 12px; }
    .data-row:last-child { border-bottom: 0; }
    .data-row span:first-child { color: var(--muted); }
    .data-row strong { text-align: right; font-size: 12px; }
    .trade-plan { display: grid; gap: 8px; margin: 0 0 12px; padding: 10px; border: 1px solid #dbeafe; border-radius: 8px; background: #f8fbff; }
    .trade-plan-title { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 800; }
    .trade-plan-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 7px; }
    .trade-plan-item { border: 1px solid #e5eaf0; border-radius: 8px; background: #fff; padding: 8px; }
    .trade-plan-item span { display: block; color: var(--muted); font-size: 11px; margin-bottom: 3px; }
    .trade-plan-item strong { font-size: 16px; }
    .signals { display: grid; gap: 8px; margin: 10px 0 12px; }
    .main-signal { padding: 15px; border-radius: 8px; color: #fff; margin: 10px 0 12px; box-shadow: 0 10px 22px rgba(15,23,42,.16); }
    .header-signals { display: grid; gap: 8px; min-width: 0; }
    .market-signal { display: grid; min-width: 0; }
    .market-signal .main-signal { margin: 0; min-height: 64px; padding: 10px 12px; display: grid; align-content: center; }
    .top-signal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; min-width: 0; }
    .mobile-main-signal { display: none; }
    .top-signal .main-signal { margin: 0; padding: 10px 12px; min-height: 76px; display: grid; align-content: center; }
    .main-signal-label { font-size: 13px; opacity: .9; }
    .main-signal-action { font-size: 32px; line-height: 1.1; font-weight: 800; margin-top: 3px; }
    .top-signal .main-signal-action { font-size: 24px; }
    .main-signal-detail { font-size: 12px; margin-top: 5px; opacity: .92; }
    .signal { display: grid; grid-template-columns: 18px 1fr; gap: 10px; align-items: center; padding: 11px; border-radius: 8px; color: #111827; border: 1px solid transparent; }
    .signal-light { width: 16px; height: 16px; border-radius: 999px; box-shadow: 0 0 0 4px rgba(255,255,255,0.45); }
    .signal-red { background: #dc2626; box-shadow: 0 0 10px rgba(220,38,38,.55); }
    .signal-lime { background: #a3e635; box-shadow: 0 0 10px rgba(132,204,22,.55); }
    .signal-orange { background: #f97316; box-shadow: 0 0 10px rgba(249,115,22,.55); }
    .signal-green { background: #16a34a; box-shadow: 0 0 10px rgba(22,163,74,.55); }
    .signal-muted { background: #9ca3af; }
    .signal-card-red { background: #fff1f2; border-color: #dc2626; }
    .signal-card-lime { background: #f7fee7; border-color: #a3e635; }
    .signal-card-orange { background: #fff7ed; border-color: #f97316; }
    .signal-card-green { background: #ecfdf5; border-color: #16a34a; }
    .signal-card-muted { background: #f3f4f6; border-color: #9ca3af; }
    .signal-action { display: block; font-size: 22px; line-height: 1.1; font-weight: 800; margin-bottom: 3px; }
    .muted { color: var(--muted); font-size: 12px; }
    canvas { width: 100%; height: 620px; display: block; }
    .tooltip { position: absolute; min-width: 190px; padding: 8px 10px; background: rgba(17, 24, 39, 0.92); color: #fff; border-radius: 6px; font-size: 12px; pointer-events: none; line-height: 1.45; box-shadow: 0 8px 24px rgba(0,0,0,0.18); z-index: 3; }

      .mobile-tab { height: 34px; border: 1px solid #c9d1dc; border-radius: 7px; background: #fff; font-size: 13px; font-weight: 700; color: #344054; }
      .mobile-tab.active { border-color: var(--blue); background: #eff6ff; color: var(--blue); }

      .mobile-tab-panel.active { display: block; }
      .mobile-main-signal.active { display: grid; margin-bottom: 10px; }
      .mobile-market-signal.active { display: grid; margin-bottom: 8px; }
      .summary-panel { padding: 10px; }
      .chart-panel { padding: 10px; }
      canvas { height: 480px; }

    <div class="brand">
      <div class="brand-title">鍾老師要看 Dashboard</div>
      <div class="brand-subtitle">價格、均線、動能與買賣訊號</div>

    <div id="mobile-title" class="mobile-title"></div>
    <div class="header-signals">
      <div id="market-signal" class="market-signal"></div>
      <div id="main-signal" class="top-signal"></div>
    </div>

      <select id="symbol"></select>
      <button id="watch-toggle" type="button">加入關注</button>
      <a class="nav-button" href="stock_watchlist.html">關注清單</a>
      <button data-range="1M">1月</button>
      <button data-range="3M">3月</button>
      <button data-range="6M">半年</button>
      <button data-range="YTD">今年</button>
      <button data-range="1Y">1年</button>
      <button data-range="ALL" class="active">全部</button>
      <input id="start" type="date">
      <input id="end" type="date">
    </div>
  </header>
  <main>
    <section class="panel info-panel">
      <h3 id="title"></h3>
      <div id="fundamentals" class="fundamentals"></div>
    </section>
    <div class="grid">
    <section class="panel summary-panel">
      <div id="trade-plan" class="trade-plan"></div>
      <div class="mobile-tabs">
        <button class="mobile-tab active" data-mobile-tab="signals">訊號</button>
        <button class="mobile-tab" data-mobile-tab="metrics">數值</button>
        <button class="mobile-tab" data-mobile-tab="auxiliary">資訊</button>
        <button class="mobile-tab" data-mobile-tab="rules">規則</button>
      </div>
      <div id="mobile-market-signal" class="market-signal mobile-market-signal mobile-tab-panel active" data-mobile-panel="signals"></div>
      <div id="mobile-main-signal" class="top-signal mobile-main-signal mobile-tab-panel active" data-mobile-panel="signals"></div>
      <div class="mobile-tab-panel active" data-mobile-panel="signals">
        <div id="signals" class="signals"></div>
      </div>
      <div class="mobile-tab-panel" data-mobile-panel="metrics">
        <div id="metrics"></div>
      </div>
      <div class="mobile-tab-panel" data-mobile-panel="auxiliary">
        <div id="auxiliary-data" class="data-panel"></div>
      </div>
      <div class="rule-panel mobile-tab-panel" data-mobile-panel="rules">
        <div class="rule-title">訊號規則</div>
        <div id="rule-controls" class="rule-grid"></div>
      </div>
      <p class="muted" id="generated"></p>
    </section>
    <section class="panel chart-panel">
      <div class="chart-tools">
        <button id="zoom-in" class="icon-button" title="放大時間軸">＋</button>
        <button id="zoom-out" class="icon-button" title="縮小時間軸">－</button>
        <button id="zoom-reset" title="重設為全部區間">重設</button>
      </div>
      <div id="indicators" class="indicator-bar"></div>
      <p class="hint">滾輪可縮放時間軸，按住圖表左右拖曳可框選區間；目前顯示區間會自動標出前高點。</p>
      <canvas id="chart"></canvas>
      <div class="axis-range">
        <div id="range-bar" class="range-bar">
          <div class="range-track"></div>
          <div id="range-window" class="range-window"></div>
          <div id="range-start" class="range-handle" title="調整開始日期"></div>
          <div id="range-end" class="range-handle" title="調整結束日期"></div>
        </div>
        <div class="range-labels"><span id="range-start-label"></span><span id="range-end-label"></span></div>
      </div>
      <div id="tooltip" class="tooltip" hidden></div>
    </section>
    </div>
  </main>

      const data = rows();

      let start = new Date(data[0].Date);
      if (range === "1M") start = addMonths(last, -1);
      if (range === "3M") start = addMonths(last, -3);
      if (range === "6M") start = addMonths(last, -6);
      if (range === "1Y") start = addMonths(last, -12);

      document.querySelectorAll("button[data-range]").forEach(button => button.classList.toggle("active", button.dataset.range === range));

    function addMonths(date, months) {
      const next = new Date(date);
      next.setMonth(next.getMonth() + months);

    function calculateTradePlan(symbol) {
      const data = rows();
      const latest = data[data.length - 1] || {};
      const quote = DATA.quotes?.[symbol] || {};
      const score = DATA.scores?.[symbol] || {};
      const price = Number.isFinite(Number(quote.price)) ? Number(quote.price) : Number(latest.Close);
      const ma5 = Number(latest.MA5);
      const ma10 = Number(latest.MA10);
      const atr14 = Number(latest.ATR14);
      const netScore = Number(score.netScore);
      if (!Number.isFinite(price)) {
        return { entryPrice: NaN, reducePrice: ma5, exitPrice: ma10, note: "價格資料不足" };
      }
      let entryPrice = price;
      let note = "目前以現價附近觀察";
      if (Number.isFinite(ma5) && price > ma5) {
        entryPrice = Number.isFinite(netScore) && netScore >= 60 ? price : ma5;
        note = Number.isFinite(netScore) && netScore >= 60 ? "強勢訊號可用現價，保守可等回測 MA5" : "可等回測 MA5 再分批進場";
      }
      let exitPrice = Number.isFinite(ma10) ? ma10 : (Number.isFinite(atr14) ? price - atr14 * 1.5 : price * 0.95);
      if (Number.isFinite(ma10) && price < ma10) {
        exitPrice = price;
        note = `${note}；已低於 MA10，持股水位應降到三成附近`;
      }
      return { entryPrice, reducePrice: ma5, exitPrice, note };
    }

      if (Math.abs(number) >= 100000000) return `${(number / 100000000).toFixed(2)} 億`;

    function latestRowWithAny(rows, fields) {
      for (let index = rows.length - 1; index >= 0; index--) {
        if (fields.some(field => rows[index][field] !== undefined && rows[index][field] !== null && rows[index][field] !== "")) {
          return rows[index];
        }
      }
      return null;
    }

    function previousRowWithValue(rows, field) {
      const filtered = rows.filter(row => Number.isFinite(Number(row[field])));
      return filtered.length >= 2 ? filtered[filtered.length - 2] : null;
    }

    function renderDataCard(title, row, pairs) {
      if (!row) {
        return `
          <div class="data-card">
            <div class="data-card-title"><strong>${title}</strong><span>尚無資料</span></div>

      return `
        <div class="data-card">
          <div class="data-card-title"><strong>${title}</strong><span>最新資料</span></div>

    function percentValue(value) {
      const number = Number(value);
      return Number.isFinite(number) ? `${number.toFixed(2)}%` : "N/A";
    }

    function retailChangeText(previous, current) {
      return pctChangeText(previous, current, "RetailUnder100LotsPct");
    }

    function pctChangeText(previous, current, field) {
      if (!previous || !current) return "N/A";
      const before = Number(previous[field]);
      const after = Number(current[field]);
      if (!Number.isFinite(before) || !Number.isFinite(after)) return "N/A";
      const change = after - before;
      return `${change >= 0 ? "+" : ""}${change.toFixed(2)}%`;
    }

    function epsChangeText(previous, current) {
      if (!previous || !current) return "N/A";
      const before = Number(previous.EPS);
      const after = Number(current.EPS);
      if (!Number.isFinite(before) || !Number.isFinite(after)) return "N/A";
      const change = after - before;
      return `${change >= 0 ? "+" : ""}${change.toFixed(2)}`;
    }

    function renderChart(data) {
      const rect = canvas.getBoundingClientRect();
      const ratio = window.devicePixelRatio || 1;
      canvas.width = Math.floor(rect.width * ratio);
      canvas.height = Math.floor(rect.height * ratio);
      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      ctx.clearRect(0, 0, rect.width, rect.height);
      if (!data.length) return;

      const pad = { left: 56, right: 16, top: 24, bottom: 78 };
      const volHeight = 120;
      const kdEnabled = enabledIndicators().some(item => item.axis === "kd");
      const oscillatorEnabled = enabledIndicators().some(item => item.axis === "oscillator");
      const kdHeight = kdEnabled ? 90 : 0;
      const oscillatorHeight = oscillatorEnabled ? 110 : 0;
      const lowerGap = kdEnabled || oscillatorEnabled ? 18 : 0;
      const priceHeight = rect.height - pad.top - pad.bottom - volHeight - 18 - kdHeight - oscillatorHeight - lowerGap;
      const chartWidth = rect.width - pad.left - pad.right;
      const highs = data.map(row => Number(row.High));
      const lows = data.map(row => Number(row.Low));
      const vols = data.map(row => Number(row.Volume));
      const maxPrice = Math.max(...highs);
      const minPrice = Math.min(...lows);
      const maxVol = Math.max(...vols);
      const candleW = Math.max(2, chartWidth / data.length * 0.62);
      chartState = { data, pad, volHeight, priceHeight, chartWidth, maxPrice, minPrice, maxVol, rect, candleW, kdEnabled, kdHeight, oscillatorEnabled, oscillatorHeight, lowerGap };

      drawGrid(pad, chartWidth, priceHeight, minPrice, maxPrice);

      data.forEach((row, index) => {
        const x = pad.left + (index + 0.5) * chartWidth / data.length;
        const open = Number(row.Open), high = Number(row.High), low = Number(row.Low), close = Number(row.Close);
        const color = close >= open ? "#d93025" : "#188038";
        const yOpen = yPrice(open, pad.top, priceHeight, minPrice, maxPrice);
        const yClose = yPrice(close, pad.top, priceHeight, minPrice, maxPrice);
        const yHigh = yPrice(high, pad.top, priceHeight, minPrice, maxPrice);
        const yLow = yPrice(low, pad.top, priceHeight, minPrice, maxPrice);
        ctx.strokeStyle = color;
        ctx.fillStyle = color;
        ctx.beginPath();
        ctx.moveTo(x, yHigh);
        ctx.lineTo(x, yLow);
        ctx.stroke();
        ctx.fillRect(x - candleW / 2, Math.min(yOpen, yClose), candleW, Math.max(1, Math.abs(yClose - yOpen)));

        const volTop = volumeTop();
        const volY = volTop + volHeight - (Number(row.Volume) / maxVol) * volHeight;
        ctx.globalAlpha = 0.35;
        ctx.fillRect(x - candleW / 2, volY, candleW, volTop + volHeight - volY);
        ctx.globalAlpha = 1;
      });

      enabledIndicators().filter(item => item.axis === "price").forEach(item => {
        drawLine(data, item.key, item.color, pad.top, priceHeight, minPrice, maxPrice, pad.left, chartWidth);
      });
      if (kdEnabled) {
        drawKdPanel(data, pad, chartWidth);
      }
      if (oscillatorEnabled) {
        drawOscillatorPanel(data, pad, chartWidth);
      }
      ctx.fillStyle = "#6b7280";
      ctx.fillText(data[0].Date, pad.left, rect.height - 28);
      ctx.fillText(data[data.length - 1].Date, rect.width - pad.right - 82, rect.height - 28);
      drawLegend(pad.left, 16);
      drawPreviousHigh(data, pad, chartWidth, priceHeight, minPrice, maxPrice);
      if (hoverIndex !== null) {
        drawHover(hoverIndex);
      }
      drawSelectionOverlay();
    }

    function yPrice(value, top, height, min, max) {
      return top + (max - value) / Math.max(1, max - min) * height;
    }

    function drawGrid(pad, width, height, min, max) {
      ctx.strokeStyle = "#edf0f4";
      ctx.fillStyle = "#6b7280";
      ctx.font = "12px Arial";
      for (let i = 0; i <= 4; i++) {
        const y = pad.top + i * height / 4;
        const price = max - i * (max - min) / 4;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + width, y);
        ctx.stroke();
        ctx.fillText(price.toFixed(2), 8, y + 4);
      }
    }

    function drawLine(data, field, color, top, height, min, max, left, width) {
      ctx.strokeStyle = color;
      ctx.beginPath();
      let started = false;
      data.forEach((row, index) => {
        const value = Number(row[field]);
        if (!value) return;
        const x = left + (index + 0.5) * width / data.length;
        const y = yPrice(value, top, height, min, max);
        if (!started) {
          ctx.moveTo(x, y);
          started = true;
        } else {
          ctx.lineTo(x, y);
        }
      });
      ctx.stroke();
    }

    function drawHover(index) {
      if (!chartState || !chartState.data.length) return;
      const { data, pad, priceHeight, chartWidth, rect, minPrice, maxPrice } = chartState;
      const row = data[index];
      if (!row) return;
      const x = pad.left + (index + 0.5) * chartWidth / data.length;
      const closeY = yPrice(Number(row.Close), pad.top, priceHeight, minPrice, maxPrice);

      ctx.save();
      ctx.strokeStyle = "rgba(31, 41, 55, 0.55)";
      ctx.setLineDash([4, 4]);
      ctx.beginPath();
      ctx.moveTo(x, pad.top);
      ctx.lineTo(x, rect.height - pad.bottom);
      ctx.moveTo(pad.left, closeY);
      ctx.lineTo(rect.width - pad.right, closeY);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#111827";
      ctx.beginPath();
      ctx.arc(x, closeY, 3.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    function drawPreviousHigh(data, pad, chartWidth, priceHeight, minPrice, maxPrice) {
      if (data.length < 2) return;
      let previousIndex = 0;
      let previousHigh = Number(data[0].High);
      for (let index = 1; index < data.length - 1; index++) {
        const high = Number(data[index].High);
        if (Number.isFinite(high) && high > previousHigh) {
          previousHigh = high;
          previousIndex = index;
        }
      }
      const x = pad.left + (previousIndex + 0.5) * chartWidth / data.length;
      const y = yPrice(previousHigh, pad.top, priceHeight, minPrice, maxPrice);
      ctx.save();
      ctx.strokeStyle = "#f97316";
      ctx.fillStyle = "#f97316";
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(pad.left + chartWidth, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = "12px Arial";
      const label = `前高 ${previousHigh.toFixed(2)} (${data[previousIndex].Date})`;
      const labelX = Math.min(x + 8, pad.left + chartWidth - 150);
      ctx.fillText(label, labelX, Math.max(14, y - 8));
      ctx.restore();
    }

    function handlePointerMove(event) {
      if (!chartState) return;
      const { data, pad, chartWidth, rect } = chartState;
      const bounds = canvas.getBoundingClientRect();
      const x = event.clientX - bounds.left;
      const y = event.clientY - bounds.top;
      if (x < pad.left || x > rect.width - pad.right || y < pad.top || y > rect.height - pad.bottom) {
        clearHover();
        return;
      }

      hoverIndex = Math.max(0, Math.min(data.length - 1, Math.floor((x - pad.left) / chartWidth * data.length)));
      const row = data[hoverIndex];
      draw();
      showTooltip(row, x, y, bounds);
    }

    function showTooltip(row, x, y, bounds) {
      const ma5 = Number(row.MA5);
      const ma10 = Number(row.MA10);
      tooltip.hidden = false;
      tooltip.innerHTML = `
        <strong>${row.Date}</strong>
        開盤: ${fmt(row.Open)}<br>
        最高: ${fmt(row.High)}<br>
        最低: ${fmt(row.Low)}<br>
        收盤: ${fmt(row.Close)}<br>
        成交量: ${Number(row.Volume).toLocaleString()}<br>
        ${indicatorTooltip(row)}
      `;
      const panelBounds = canvas.parentElement.getBoundingClientRect();
      const left = Math.min(bounds.left - panelBounds.left + x + 14, panelBounds.width - tooltip.offsetWidth - 12);
      const top = Math.max(12, bounds.top - panelBounds.top + y - tooltip.offsetHeight - 12);
      tooltip.style.left = `${left}px`;
      tooltip.style.top = `${top}px`;
    }

    function clearHover() {
      if (hoverIndex === null && tooltip.hidden) return;
      hoverIndex = null;
      tooltip.hidden = true;
      draw();
    }

    function fmt(value) {
      const number = Number(value);
      return Number.isFinite(number) ? number.toFixed(2) : "N/A";
    }

    function formatCompactNumber(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return "N/A";
      if (Math.abs(number) >= 100000000) return `${(number / 100000000).toFixed(2)}億`;
      if (Math.abs(number) >= 10000) return `${(number / 10000).toFixed(2)}萬`;
      return number.toLocaleString();
    }

    function renderIndicatorControls() {
      document.getElementById("indicators").innerHTML = INDICATORS.map(item => `
        <label class="indicator">
          <input type="checkbox" data-indicator="${item.key}" ${item.enabled ? "checked" : ""}>
          <span class="indicator-dot" style="background:${item.color}"></span>
          ${item.label}
        </label>
      `).join("");
      document.querySelectorAll("input[data-indicator]").forEach(input => {
        input.addEventListener("change", () => {
          const item = INDICATORS.find(entry => entry.key === input.dataset.indicator);
          item.enabled = input.checked;
          draw();
        });
      });
    }

    function renderRuleControls() {
      ruleControls.innerHTML = SIGNAL_RULES.map(rule => `
        <label class="rule-option">
          <input type="checkbox" data-rule="${rule.key}" ${rule.enabled ? "checked" : ""}>
          <span>${rule.label}</span>
          <span class="rule-tag">${rule.tag}</span>
        </label>
      `).join("");
      document.querySelectorAll("input[data-rule]").forEach(input => {
        input.addEventListener("change", () => {
          const rule = SIGNAL_RULES.find(entry => entry.key === input.dataset.rule);
          rule.enabled = input.checked;
          draw();
        });
      });
    }

    function renderSignals(data, quote) {
      const evaluated = SIGNAL_RULES
        .filter(rule => rule.enabled)
        .map(rule => evaluateSignalRule(rule, data, quote))
        .filter(Boolean)
        .map(item => enrichSignalScore(item));

      const items = evaluated.length
        ? evaluated
        : [{ light: "signal-muted", card: "signal-card-muted", rank: 0, rule: "沒有啟用或符合的訊號規則", action: "無訊號", detail: "請勾選左側訊號規則", score: 0, scoreType: "neutral" }];

      const technicalItems = evaluated.filter(item => TECHNICAL_SIGNAL_KEYS.includes(item.key));
      const chipItems = evaluateSignalGroup(CHIP_SIGNAL_KEYS, data, quote);
      const fundamentalItems = evaluateSignalGroup(FUNDAMENTAL_SIGNAL_KEYS, data, quote);
      const technicalSummary = calculateSignalScore(technicalItems);
      const chipSummary = calculateSignalScore(chipItems, { strong: 35, buy: 22, prepare: 8, observe: -8, reduce: -18, sell: -30 });
      const fundamentalSummary = calculateSignalScore(fundamentalItems, { strong: 28, buy: 18, prepare: 8, observe: -8, reduce: -18, sell: -30 });
      const marketSummary = evaluateMarketPosition();
      document.getElementById("market-signal").innerHTML = renderMainSignalCard("大盤水位", marketSummary);
      document.getElementById("main-signal").innerHTML = `
        ${renderMainSignalCard("技術面", technicalSummary)}
        ${renderMainSignalCard("籌碼面", chipSummary)}
        ${renderMainSignalCard("基本面", fundamentalSummary)}
      `;
      document.getElementById("mobile-market-signal").innerHTML = document.getElementById("market-signal").innerHTML;
      document.getElementById("mobile-main-signal").innerHTML = document.getElementById("main-signal").innerHTML;
      document.getElementById("signals").innerHTML = items.map(item => `
        <div class="signal ${item.card}">
          <span class="signal-light ${item.light}"></span>
          <span><span class="signal-action">${item.action}</span>${item.rule}<br><span class="muted">${scoreLabel(item)}，${item.detail}</span></span>
        </div>
      `).join("");
    }

    function evaluateMarketPosition() {
      const market = DATA.market || {};
      const rows = market.histories || [];
      const latest = rows[rows.length - 1] || {};
      const close = Number(latest.Close);
      const ma5 = Number(latest.MA5);
      const ma10 = Number(latest.MA10);
      const date = latest.Date || "N/A";
      if (![close, ma5, ma10].every(Number.isFinite)) {
        return {
          action: "無資料",
          light: "signal-muted",
          entryScore: 0,
          exitScore: 0,
          netScore: 0,
          detail: `${market.label || "台股大盤"}尚無 MA5/MA10 資料`,
        };
      }
      if (close > ma5) {
        return {
          action: "水位可放大",
          light: "signal-red",
          entryScore: 20,
          exitScore: 0,
          netScore: 20,
          detail: `${date} 收盤 ${fmt(close)} > MA5 ${fmt(ma5)}，持股水位可高一點`,
        };
      }
      if (close >= ma10) {
        return {
          action: "訊號轉弱",
          light: "signal-orange",
          entryScore: 0,
          exitScore: 15,
          netScore: -15,
          detail: `${date} 收盤介於 MA5 ${fmt(ma5)} 與 MA10 ${fmt(ma10)}，降低持股水位`,
        };
      }
      return {
        action: "降到三成",
        light: "signal-green",
        entryScore: 0,
        exitScore: 35,
        netScore: -35,
        detail: `${date} 收盤 ${fmt(close)} < MA10 ${fmt(ma10)}，持股水位降到 3 成`,
      };
    }

    function evaluateSignalGroup(keys, data, quote) {
      return keys
        .map(key => SIGNAL_RULES.find(rule => rule.key === key))
        .filter(Boolean)
        .map(rule => evaluateSignalRule(rule, data, quote))
        .filter(Boolean)
        .map(item => enrichSignalScore(item));
    }

    function renderMainSignalCard(title, summary) {
      return `
        <div class="main-signal ${summary.light}">
          <div class="main-signal-label">${title}訊號</div>
          <div class="main-signal-action">${summary.action}</div>
          <div class="main-signal-detail">進場 ${summary.entryScore} / 風險 ${summary.exitScore} / 淨分 ${summary.netScore}，${summary.detail}</div>
        </div>
      `;
    }

    function enrichSignalScore(item) {
      const weight = SIGNAL_WEIGHTS[item.key] || {};
      const score = Number(weight.score);
      const scoreType = weight.type || weight.scoreType || "neutral";
      return {
        ...item,
        score: Number.isFinite(score) ? score : 0,
        scoreType,
        critical: Boolean(weight.critical),
      };
    }

    function calculateSignalScore(items, thresholds = { strong: 60, buy: 35, prepare: 15, observe: -15, reduce: -35, sell: -60 }) {
      if (!items.length) {
        return { action: "無訊號", light: "signal-muted", entryScore: 0, exitScore: 0, netScore: 0, detail: "目前沒有符合的訊號規則" };
      }
      const entryScore = items.filter(item => item.scoreType === "entry").reduce((sum, item) => sum + item.score, 0);
      const exitScore = items.filter(item => item.scoreType === "exit").reduce((sum, item) => sum + item.score, 0);
      const netScore = entryScore - exitScore;
      const criticalExit = items.filter(item => item.scoreType === "exit" && item.critical);

      if (criticalExit.length) {
        return {
          action: "停損/強制退場",
          light: "signal-green",
          entryScore,
          exitScore,
          netScore,
          detail: `重大風險優先：${criticalExit.map(item => item.rule).join("、")}`,
        };
      }
      if (netScore >= thresholds.strong) return { action: "強力買進", light: "signal-red", entryScore, exitScore, netScore, detail: "多方訊號明顯大於風險" };
      if (netScore >= thresholds.buy) return { action: "買", light: "signal-red", entryScore, exitScore, netScore, detail: "進場分數偏強" };
      if (netScore >= thresholds.prepare) return { action: "準備買", light: "signal-orange", entryScore, exitScore, netScore, detail: "多方略占優勢，仍需觀察風險" };
      if (netScore > thresholds.observe) return { action: "觀察", light: "signal-lime", entryScore, exitScore, netScore, detail: "多空分數接近" };
      if (netScore > thresholds.reduce) return { action: "注意/減碼", light: "signal-lime", entryScore, exitScore, netScore, detail: "風險分數開始壓過進場分數" };
      if (netScore > thresholds.sell) return { action: "賣", light: "signal-green", entryScore, exitScore, netScore, detail: "風險分數偏高" };
      return { action: "停損", light: "signal-green", entryScore, exitScore, netScore, detail: "風險分數明顯大於進場分數" };
    }

    function scoreLabel(item) {
      if (item.scoreType === "entry") return `進場 +${item.score}`;
      if (item.scoreType === "exit") return `風險 -${item.score}${item.critical ? " / 重大" : ""}`;
      return `分數 ${item.score}`;
    }

    function evaluateSignalRule(rule, data, quote) {
      const latest = data[data.length - 1] || {};
      const previous = data[data.length - 2] || {};
      const realtime = Number(quote.price);
      const value = key => Number(latest[key]);
      const prev = key => Number(previous[key]);
      let matched = false;
      let detail = "N/A";

      if (rule.key === "price_gt_ma5") [matched, detail] = compareValues(realtime, value("MA5"), ">");
      if (rule.key === "price_lt_ma5") [matched, detail] = compareValues(realtime, value("MA5"), "<");
      if (rule.key === "price_gt_ma10") [matched, detail] = compareValues(realtime, value("MA10"), ">");
      if (rule.key === "price_lt_ma10") [matched, detail] = compareValues(realtime, value("MA10"), "<");
      if (rule.key === "rsi_lt_30") [matched, detail] = compareValues(value("RSI14"), 30, "<");
      if (rule.key === "rsi_gt_70") [matched, detail] = compareValues(value("RSI14"), 70, ">");
      if (rule.key === "kd_golden") [matched, detail] = crossValues(prev("K"), prev("D"), value("K"), value("D"), "up");
      if (rule.key === "kd_dead") [matched, detail] = crossValues(prev("K"), prev("D"), value("K"), value("D"), "down");
      if (rule.key === "macd_golden") [matched, detail] = crossValues(prev("MACD"), prev("MACDSignal"), value("MACD"), value("MACDSignal"), "up");
      if (rule.key === "macd_dead") [matched, detail] = crossValues(prev("MACD"), prev("MACDSignal"), value("MACD"), value("MACDSignal"), "down");
      if (rule.key === "descending_resistance_breakout") [matched, detail] = priorHighResistanceBreakout(data, false);
      if (rule.key === "first_breakout_chase") [matched, detail] = priorHighResistanceBreakout(data, true);
      if (rule.key === "three_ma_bullish_entry") [matched, detail] = closeAboveMovingAverages(data, ["MA5", "MA10", "MA20"]);
      if (rule.key === "all_ma_bullish_entry") [matched, detail] = closeAboveMovingAverages(data, ["MA5", "MA10", "MA20", "MA30", "MA60", "MA120"]);
      if (rule.key === "base_rebound_entry") [matched, detail] = baseReboundEntry(data);
      if (rule.key === "retail_holding_drop_reversal") [matched, detail] = retailHoldingDropReversal(symbolSelect.value);
      if (rule.key === "ma10_breakdown_exit") [matched, detail] = movingAverageBreakdown(data, "MA10");
      if (rule.key === "bull_ma5_breakdown") [matched, detail] = bullMa5Breakdown(data);
      if (rule.key === "high_volume_low_break") [matched, detail] = highVolumeLowBreak(data);
      if (rule.key === "three_short_ma_breakdown") [matched, detail] = threeShortMaBreakdown(data);
      if (rule.key === "volume_dry_up_warning") [matched, detail] = volumeDryUpWarning(data);
      if (rule.key === "long_black_candle_exit") [matched, detail] = longBlackCandleExit(data);
      if (rule.key === "positive_bias_overheat") [matched, detail] = positiveBiasRule(data, 5, 10);
      if (rule.key === "positive_bias_extreme") [matched, detail] = positiveBiasRule(data, 10, null);
      if (rule.key === "ma5_retest_hold") [matched, detail] = ma5RetestHold(data);
      if (rule.key === "foreign_net_buy") [matched, detail] = auxiliaryNumberRule("chip", "ForeignNetBuySell", ">", 0);
      if (rule.key === "investment_trust_net_buy") [matched, detail] = auxiliaryNumberRule("chip", "InvestmentTrustNetBuySell", ">", 0);
      if (rule.key === "institutional_net_buy") [matched, detail] = auxiliaryNumberRule("chip", "InstitutionalNetBuySell", ">", 0);
      if (rule.key === "retail_ratio_drop") [matched, detail] = retailHoldingDropReversal(symbolSelect.value);
      if (rule.key === "foreign_net_sell") [matched, detail] = auxiliaryNumberRule("chip", "ForeignNetBuySell", "<", 0);
      if (rule.key === "investment_trust_net_sell") [matched, detail] = auxiliaryNumberRule("chip", "InvestmentTrustNetBuySell", "<", 0);
      if (rule.key === "low_pe") [matched, detail] = auxiliaryNumberRule("fundamentals", "PE", "<=", 15, true);
      if (rule.key === "high_dividend_yield") [matched, detail] = auxiliaryNumberRule("fundamentals", "DividendYieldPct", ">=", 4, true);
      if (rule.key === "pb_below_one") [matched, detail] = auxiliaryNumberRule("fundamentals", "PB", "<=", 1, true);
      if (rule.key === "pe_too_high") [matched, detail] = auxiliaryNumberRule("fundamentals", "PE", ">=", 30, true);
      if (rule.key === "positive_eps_growth") [matched, detail] = epsGrowthRule();
      if (rule.key === "negative_eps") [matched, detail] = auxiliaryNumberRule("eps", "EPS", "<", 0, true);

      return matched ? { ...rule, rule: rule.label, detail } : null;
    }

    function closeMa5Bias(row) {
      const close = Number(row.Close);
      const ma5 = Number(row.MA5);
      if (!Number.isFinite(close) || !Number.isFinite(ma5) || ma5 === 0) return NaN;
      return (close - ma5) / ma5 * 100;
    }

    function positiveBiasRule(data, minPct, maxPct = null) {
      if (!data.length) return [false, "資料不足"];
      const latest = data[data.length - 1];
      const bias = closeMa5Bias(latest);
      if (!Number.isFinite(bias)) return [false, "MA5 乖離資料不足"];
      const matched = maxPct === null ? bias > minPct : bias > minPct && bias <= maxPct;
      const rangeText = maxPct === null ? `> ${minPct}%` : `${minPct}% ~ ${maxPct}%`;
      return [matched, `收盤 ${fmt(latest.Close)} / MA5 ${fmt(latest.MA5)}，正乖離 ${bias.toFixed(2)}%（警示區 ${rangeText}）`];
    }

    function ma5RetestHold(data) {
      if (data.length < 8) return [false, "資料少於 8 根K棒"];
      const latest = data[data.length - 1];
      const recent = data.slice(-8);
      const latestClose = Number(latest.Close);
      const latestLow = Number(latest.Low);
      const latestOpen = Number(latest.Open);
      const latestMa5 = Number(latest.MA5);
      const latestBias = closeMa5Bias(latest);
      const recentBiases = recent.map(closeMa5Bias).filter(Number.isFinite);
      if (![latestClose, latestLow, latestOpen, latestMa5, latestBias].every(Number.isFinite) || !recentBiases.length) {
        return [false, "回測 MA5 資料不足"];
      }

      const maxRecentBias = Math.max(...recentBiases);
      const hadOverheat = maxRecentBias >= 5;
      const retestMa5 = latestLow <= latestMa5 * 1.01;
      const holdMa5 = latestClose >= latestMa5 && latestLow >= latestMa5 * 0.985;
      const biasContracted = latestBias <= Math.max(3.5, maxRecentBias - 2);
      const notWeakCandle = latestClose >= latestOpen || latestClose >= latestMa5 * 1.005;
      const matched = hadOverheat && retestMa5 && holdMa5 && biasContracted && notWeakCandle;
      return [matched, `近8日最大乖離 ${maxRecentBias.toFixed(2)}%，目前 ${latestBias.toFixed(2)}%，低點 ${fmt(latestLow)} 回測 MA5 ${fmt(latestMa5)} 未跌破`];
    }

    function latestAuxiliaryRow(dataset, field = null) {
      const symbol = symbolSelect.value;
      const rows = DATA.auxiliary?.[symbol]?.[dataset] || [];
      for (let index = rows.length - 1; index >= 0; index--) {
        if (!field || Number.isFinite(Number(rows[index][field]))) return rows[index];
      }
      return null;
    }

    function auxiliaryNumberRule(dataset, field, operator, threshold, positiveOnly = false) {
      const row = latestAuxiliaryRow(dataset, field);
      if (!row) return [false, `${dataset}.${field} 無資料`];
      const value = Number(row[field]);
      if (!Number.isFinite(value)) return [false, `${field} 無資料`];
      if (positiveOnly && value <= 0) return [false, `${field} ${fmt(value)} 不是有效正值`];
      const matched =
        operator === ">" ? value > threshold :
        operator === "<" ? value < threshold :
        operator === ">=" ? value >= threshold :
        value <= threshold;
      return [matched, `${row.Date || ""} ${field} ${formatCompactNumber(value)} ${operator} ${formatCompactNumber(threshold)}`];
    }

    function epsGrowthRule() {
      const symbol = symbolSelect.value;
      const rows = (DATA.auxiliary?.[symbol]?.eps || [])
        .filter(row => Number.isFinite(Number(row.EPS)))
        .slice(-2);
      if (rows.length < 2) return [false, "需要至少兩筆 EPS 資料"];
      const previous = Number(rows[0].EPS);
      const current = Number(rows[1].EPS);
      const matched = current > previous && current > 0;
      return [matched, `${rows[0].Date || rows[0].Season || ""} EPS ${fmt(previous)} → ${rows[1].Date || rows[1].Season || ""} EPS ${fmt(current)}`];
    }

    function priorHighResistanceBreakout(data, firstOnly) {
      if (data.length < 25) return [false, "資料少於 25 根K棒"];
      const latest = data[data.length - 1];
      const previous = data[data.length - 2];
      const priorRows = data.slice(Math.max(0, data.length - 121), data.length - 1);
      if (priorRows.length < 10) return [false, "前高觀察資料不足"];

      const resistanceRow = priorRows.reduce((best, row) => {
        const high = Number(row.High);
        return Number.isFinite(high) && (!best || high > best.value)
          ? { value: high, date: row.Date }
          : best;
      }, null);
      if (!resistanceRow) return [false, "找不到前高壓力"];

      const resistance = resistanceRow.value;
      const open = Number(latest.Open);
      const high = Number(latest.High);
      const close = Number(latest.Close);
      const prevHigh = Number(previous.High);
      const prevClose = Number(previous.Close);
      const atr = Number(latest.ATR14);
      const volume = Number(latest.Volume);
      const volumeMa20 = Number(latest.VolumeMA20);
      if (![resistance, open, high, close, prevClose, volume].every(Number.isFinite)) {
        return [false, "突破判斷資料不足"];
      }

      const closeBreakout = close > resistance;
      const intradayOnly = high > resistance && close <= resistance;
      const redCandle = close > open;
      const body = Math.abs(close - open);
      const bodyPct = open > 0 ? body / open * 100 : 0;
      const longRedBody = redCandle && (bodyPct >= 2 || (Number.isFinite(atr) && body >= atr * 0.5));
      const gapUp = Number.isFinite(prevHigh) && open > prevHigh && open > resistance;
      const volumeConfirm = Number.isFinite(volumeMa20) && volumeMa20 > 0 ? volume >= volumeMa20 * 1.5 : true;
      const firstBreakout = !Number.isFinite(prevClose) || prevClose <= resistance;
      const successfulBreakout = closeBreakout && (longRedBody || gapUp) && volumeConfirm;
      const matched = successfulBreakout && (!firstOnly || firstBreakout);

      if (intradayOnly) {
        return [false, `盤中碰到前高 ${fmt(resistance)}，但收盤 ${fmt(close)} 未站穩`];
      }
      const candleText = gapUp ? "向上跳空" : longRedBody ? `長紅K實體 ${bodyPct.toFixed(1)}%` : "K棒攻擊力不足";
      const volumeText = Number.isFinite(volumeMa20)
        ? `成交量 ${formatCompactNumber(volume)} / 20日均量 ${formatCompactNumber(volumeMa20)}`
        : `成交量 ${formatCompactNumber(volume)}`;
      return [matched, `景線 ${resistanceRow.date} ${fmt(resistance)}，收盤 ${fmt(close)}，${candleText}，${volumeText}`];
    }

    function bullMa5Breakdown(data) {
      return movingAverageBreakdown(data, "MA5");
    }

    function closeAboveMovingAverages(data, maKeys) {
      if (!data.length) return [false, "資料不足"];
      const latest = data[data.length - 1];
      const close = Number(latest.Close);
      const maValues = maKeys.map(key => ({ key, value: Number(latest[key]) }));
      if (!Number.isFinite(close) || maValues.some(item => !Number.isFinite(item.value))) {
        return [false, "均線資料不足"];
      }
      const matched = maValues.every(item => close > item.value);
      const detail = `收盤 ${fmt(close)} > ${maValues.map(item => `${item.key} ${fmt(item.value)}`).join("、")}`;
      return [matched, detail];
    }

    function movingAverageBreakdown(data, maKey) {
      if (data.length < 2) return [false, "資料不足"];
      const latest = data[data.length - 1];
      const previous = data[data.length - 2];
      const close = Number(latest.Close);
      const ma = Number(latest[maKey]);
      const prevClose = Number(previous.Close);
      const prevMa = Number(previous[maKey]);
      const matched = [close, ma, prevClose, prevMa].every(Number.isFinite) && prevClose >= prevMa && close < ma;
      return [matched, `前一日收盤 ${fmt(prevClose)} >= ${maKey} ${fmt(prevMa)}，最新收盤 ${fmt(close)} < ${maKey} ${fmt(ma)}`];
    }

    function threeShortMaBreakdown(data) {
      if (data.length < 2) return [false, "資料不足"];
      const latest = data[data.length - 1];
      const previous = data[data.length - 2];
      const close = Number(latest.Close);
      const prevClose = Number(previous.Close);
      const maKeys = ["MA5", "MA10", "MA20"];
      const currentMas = maKeys.map(key => ({ key, value: Number(latest[key]) }));
      const previousMas = maKeys.map(key => ({ key, value: Number(previous[key]) }));
      if (![close, prevClose, ...currentMas.map(item => item.value), ...previousMas.map(item => item.value)].every(Number.isFinite)) {
        return [false, "短均線資料不足"];
      }
      const belowAll = currentMas.every(item => close < item.value);
      const justLost = previousMas.some(item => prevClose >= item.value);
      const matched = belowAll && justLost;
      const detail = `收盤 ${fmt(close)} 同時跌破 ${currentMas.map(item => `${item.key} ${fmt(item.value)}`).join("、")}`;
      return [matched, detail];
    }

    function baseReboundEntry(data) {
      if (data.length < 30) return [false, "資料少於 30 根K棒"];
      const latest = data[data.length - 1];
      const recent = data.slice(Math.max(0, data.length - 16));
      const prior = data.slice(Math.max(0, data.length - 85), Math.max(0, data.length - 5));
      if (prior.length < 10 || recent.length < 8) return [false, "主底觀察資料不足"];

      const priorLowRow = prior.reduce((best, row) => Number(row.Low) < Number(best.Low) ? row : best, prior[0]);
      const highRows = data.slice(Math.max(0, data.length - 80));
      const high80 = Math.max(...highRows.map(row => Number(row.High)).filter(Number.isFinite));
      const recentLows = recent.map(row => Number(row.Low)).filter(Number.isFinite);
      const recentCloses = recent.map(row => Number(row.Close)).filter(Number.isFinite);
      const priorLow = Number(priorLowRow.Low);
      const recentLow = Math.min(...recentLows);
      const recentCloseHigh = Math.max(...recentCloses);
      const recentCloseLow = Math.min(...recentCloses);
      const close = Number(latest.Close);
      const open = Number(latest.Open);
      const ma5 = Number(latest.MA5);
      if (![priorLow, recentLow, recentCloseHigh, recentCloseLow, close, open, ma5, high80].every(Number.isFinite)) {
        return [false, "主底判斷資料不足"];
      }

      const drawdownPct = high80 > 0 ? (high80 - priorLow) / high80 * 100 : 0;
      const rangePct = priorLow > 0 ? (recentCloseHigh - recentCloseLow) / priorLow * 100 : 100;
      const supportHeld = recentLow >= priorLow * 0.98;
      const sidewaysBase = rangePct <= 12;
      const rebound = close >= open && close > ma5;
      const matched = drawdownPct >= 12 && supportHeld && sidewaysBase && rebound;
      const detail = `前波低點 ${priorLowRow.Date} ${fmt(priorLow)}，近15日收盤區間 ${rangePct.toFixed(1)}%，收盤 ${fmt(close)} > MA5 ${fmt(ma5)}`;
      return [matched, detail];
    }

    function retailHoldingDropReversal(symbol) {
      const chipRows = DATA.auxiliary?.[symbol]?.chip || [];
      const rows = chipRows
        .filter(row => Number.isFinite(Number(row.RetailUnder100LotsPct)))
        .slice(-8);
      if (rows.length < 2) return [false, "需要至少兩筆 TDCC 100張以下持股比例資料"];
      const latest = rows[rows.length - 1];
      const previous = rows[rows.length - 2];
      const currentPct = Number(latest.RetailUnder100LotsPct);
      const previousPct = Number(previous.RetailUnder100LotsPct);
      const change = currentPct - previousPct;
      const matched = change <= -1;
      return [matched, `100張以下持股 ${previousPct.toFixed(2)}% → ${currentPct.toFixed(2)}%，變化 ${change.toFixed(2)}%`];
    }

    function highVolumeLowBreak(data) {
      if (data.length < 10) return [false, "資料不足"];
      const latest = data[data.length - 1];
      const lookback = data.slice(Math.max(0, data.length - 61), data.length - 1);
      const highVolumeRow = lookback.reduce((best, row) => Number(row.Volume) > Number(best.Volume) ? row : best, lookback[0]);
      const close = Number(latest.Close);
      const low = Number(latest.Low);
      const highVolumeLow = Number(highVolumeRow.Low);
      const matched = [close, low, highVolumeLow].every(Number.isFinite) && (close < highVolumeLow || low < highVolumeLow);
      return [matched, `爆量K ${highVolumeRow.Date} 低點 ${fmt(highVolumeLow)}，最新收盤 ${fmt(close)}`];
    }

    function volumeDryUpWarning(data) {
      if (data.length < 21) return [false, "資料不足"];
      const latest = data[data.length - 1];
      const volume = Number(latest.Volume);
      const volumeMa20 = Number(latest.VolumeMA20);
      const recent = data.slice(Math.max(0, data.length - 21), data.length - 1).map(row => Number(row.Volume)).filter(Number.isFinite);
      const avg = recent.reduce((sum, value) => sum + value, 0) / Math.max(1, recent.length);
      const baseline = Number.isFinite(volumeMa20) ? volumeMa20 : avg;
      const matched = Number.isFinite(volume) && Number.isFinite(baseline) && baseline > 0 && volume <= baseline * 0.55;
      return [matched, `成交量 ${formatCompactNumber(volume)}，20日均量 ${formatCompactNumber(baseline)}`];
    }

    function longBlackCandleExit(data) {
      if (data.length < 2) return [false, "資料不足"];
      const latest = data[data.length - 1];
      const previous = data[data.length - 2];
      const open = Number(latest.Open);
      const close = Number(latest.Close);
      const high = Number(latest.High);
      const low = Number(latest.Low);
      const prevClose = Number(previous.Close);
      const rsi = Number(latest.RSI14);
      const atr = Number(latest.ATR14);
      const bodyPct = Number.isFinite(prevClose) && prevClose !== 0 ? (open - close) / prevClose * 100 : NaN;
      const range = high - low;
      const closeNearLow = Number.isFinite(range) && range > 0 ? (close - low) / range <= 0.35 : true;
      const atrBody = Number.isFinite(atr) && atr > 0 ? open - close >= atr * 0.8 : false;
      const overheated = Number.isFinite(rsi) ? rsi >= 60 : true;
      const matched = [open, close].every(Number.isFinite) && close < open && closeNearLow && overheated && (bodyPct >= 3 || atrBody);
      return [matched, `黑K實體 ${Number.isFinite(bodyPct) ? bodyPct.toFixed(2) : "N/A"}%，RSI14 ${fmt(rsi)}`];
    }

    function isBullishAlignment(row) {
      const ma5 = Number(row.MA5);
      const ma10 = Number(row.MA10);
      const ma20 = Number(row.MA20);
      return [ma5, ma10, ma20].every(Number.isFinite) && ma5 > ma10 && ma10 > ma20;
    }

    function compareValues(left, right, operator) {
      if (!Number.isFinite(left) || !Number.isFinite(right)) return [false, "N/A"];
      const matched = operator === ">" ? left > right : left < right;
      return [matched, `${left.toFixed(2)} ${operator} ${right.toFixed(2)}`];
    }

    function crossValues(prevA, prevB, currentA, currentB, direction) {
      if (![prevA, prevB, currentA, currentB].every(Number.isFinite)) return [false, "N/A"];
      const matched = direction === "up"
        ? prevA <= prevB && currentA > currentB
        : prevA >= prevB && currentA < currentB;
      return [matched, `${currentA.toFixed(2)} / ${currentB.toFixed(2)}`];
    }

    function enabledIndicators() {
      return INDICATORS.filter(item => item.enabled);
    }

    function indicatorTooltip(row) {
      return enabledIndicators().map(item => `${item.label}: ${fmt(row[item.key])}`).join("<br>");
    }

    function volumeTop() {
      return chartState.pad.top + chartState.priceHeight + 18 + chartState.kdHeight + chartState.oscillatorHeight + chartState.lowerGap;
    }

    function drawKdPanel(data, pad, chartWidth) {
      const top = pad.top + chartState.priceHeight + 18;
      ctx.strokeStyle = "#edf0f4";
      ctx.fillStyle = "#6b7280";
      ctx.beginPath();
      ctx.rect(pad.left, top, chartWidth, chartState.kdHeight);
      ctx.stroke();
      [20, 50, 80].forEach(value => {
        const y = top + (100 - value) / 100 * chartState.kdHeight;
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + chartWidth, y);
        ctx.stroke();
        ctx.fillText(value, 24, y + 4);
      });
      enabledIndicators().filter(item => item.axis === "kd").forEach(item => {
        drawLine(data, item.key, item.color, top, chartState.kdHeight, 0, 100, pad.left, chartWidth);
      });
    }

    function drawOscillatorPanel(data, pad, chartWidth) {
      const top = pad.top + chartState.priceHeight + 18 + chartState.kdHeight;
      const items = enabledIndicators().filter(item => item.axis === "oscillator");
      const values = [];
      items.forEach(item => data.forEach(row => {
        const value = Number(row[item.key]);
        if (Number.isFinite(value)) values.push(value);
      }));
      if (!values.length) return;
      let min = Math.min(...values);
      let max = Math.max(...values);
      if (min === max) {
        min -= 1;
        max += 1;
      }

      ctx.strokeStyle = "#edf0f4";
      ctx.fillStyle = "#6b7280";
      ctx.beginPath();
      ctx.rect(pad.left, top, chartWidth, chartState.oscillatorHeight);
      ctx.stroke();
      [min, (min + max) / 2, max].forEach(value => {
        const y = yPrice(value, top, chartState.oscillatorHeight, min, max);
        ctx.beginPath();
        ctx.moveTo(pad.left, y);
        ctx.lineTo(pad.left + chartWidth, y);
        ctx.stroke();
        ctx.fillText(value.toFixed(2), 8, y + 4);
      });
      items.forEach(item => {
        drawLine(data, item.key, item.color, top, chartState.oscillatorHeight, min, max, pad.left, chartWidth);
      });
    }

    function drawLegend(x, y) {
      let offset = 0;
      enabledIndicators().forEach(item => {
        ctx.fillStyle = item.color;
        ctx.fillText(item.label, x + offset, y);
        offset += ctx.measureText(item.label).width + 16;
      });
    }

    function rowIndexFromX(x) {
      if (!chartState) return 0;
      const { data, pad, chartWidth } = chartState;
      return Math.max(0, Math.min(data.length - 1, Math.floor((x - pad.left) / chartWidth * data.length)));
    }

    function setDateRangeByIndexes(startIndex, endIndex) {
      const data = rows();
      if (!data.length) return;
      const lo = Math.max(0, Math.min(startIndex, endIndex));
      const hi = Math.min(data.length - 1, Math.max(startIndex, endIndex));
      if (hi - lo < 2) return;
      startInput.value = data[lo].Date;
      endInput.value = data[hi].Date;
      document.querySelectorAll("button[data-range]").forEach(button => button.classList.remove("active"));
      clearHover();
      draw();
    }

    function handleWheel(event) {
      if (!chartState) return;
      event.preventDefault();
      zoomByFactor(event.deltaY < 0 ? 0.75 : 1.35, event.clientX - canvas.getBoundingClientRect().left);
    }

    function zoomByFactor(factor, focusX = null) {
      if (!chartState) return;
      const allRows = rows();
      const shown = filteredRows();
      if (allRows.length < 5 || shown.length < 5) return;
      const focusShownIndex = focusX === null ? Math.floor(shown.length / 2) : rowIndexFromX(focusX);
      const focusDate = shown[focusShownIndex]?.Date || shown[Math.floor(shown.length / 2)].Date;
      const focusAllIndex = allRows.findIndex(row => row.Date === focusDate);
      const nextLength = Math.max(5, Math.min(allRows.length, Math.round(shown.length * factor)));
      const focusRatio = shown.length > 1 ? focusShownIndex / (shown.length - 1) : 0.5;
      let startIndex = Math.round(focusAllIndex - nextLength * focusRatio);
      startIndex = Math.max(0, Math.min(allRows.length - nextLength, startIndex));
      const endIndex = startIndex + nextLength - 1;
      startInput.value = allRows[startIndex].Date;
      endInput.value = allRows[endIndex].Date;
      document.querySelectorAll("button[data-range]").forEach(button => button.classList.remove("active"));
      clearHover();
      draw();
    }

    function resetZoom() {
      setRange("ALL");
    }

    function currentRangeIndexes() {
      const data = rows();
      if (!data.length) return { start: 0, end: 0 };
      const start = startInput.value || data[0].Date;
      const end = endInput.value || data[data.length - 1].Date;
      let startIndex = data.findIndex(row => row.Date >= start);
      let endIndex = data.findLastIndex ? data.findLastIndex(row => row.Date <= end) : findLastIndex(data, row => row.Date <= end);
      if (startIndex < 0) startIndex = 0;
      if (endIndex < 0) endIndex = data.length - 1;
      return { start: startIndex, end: endIndex };
    }

    function findLastIndex(array, predicate) {
      for (let index = array.length - 1; index >= 0; index--) {
        if (predicate(array[index])) return index;
      }
      return -1;
    }

    function updateRangeBar() {
      const data = rows();
      if (!data.length) return;
      const { start, end } = currentRangeIndexes();
      const denominator = Math.max(1, data.length - 1);
      const startPct = start / denominator * 100;
      const endPct = end / denominator * 100;
      rangeStartHandle.style.left = `${startPct}%`;
      rangeEndHandle.style.left = `${endPct}%`;
      rangeWindow.style.left = `${startPct}%`;
      rangeWindow.style.width = `${Math.max(0, endPct - startPct)}%`;
      rangeStartLabel.textContent = data[start]?.Date || "";
      rangeEndLabel.textContent = data[end]?.Date || "";
    }

    function rangeIndexFromPointer(event) {
      const data = rows();
      const bounds = rangeBar.getBoundingClientRect();
      const ratio = Math.max(0, Math.min(1, (event.clientX - bounds.left) / bounds.width));
      return Math.round(ratio * Math.max(0, data.length - 1));
    }

    function updateRangeFromHandle(event) {
      const data = rows();
      if (!data.length || !activeRangeHandle) return;
      const current = currentRangeIndexes();
      const nextIndex = rangeIndexFromPointer(event);
      let startIndex = current.start;
      let endIndex = current.end;
      if (activeRangeHandle === "start") {
        startIndex = Math.min(nextIndex, endIndex - 2);
      } else {
        endIndex = Math.max(nextIndex, startIndex + 2);
      }
      startIndex = Math.max(0, startIndex);
      endIndex = Math.min(data.length - 1, endIndex);
      startInput.value = data[startIndex].Date;
      endInput.value = data[endIndex].Date;
      document.querySelectorAll("button[data-range]").forEach(button => button.classList.remove("active"));
      draw();
    }

    function startRangeDrag(handle, event) {
      activeRangeHandle = handle;
      rangeBar.setPointerCapture(event.pointerId);
      updateRangeFromHandle(event);
    }

    function stopRangeDrag() {
      activeRangeHandle = null;
    }

    function handlePointerDown(event) {
      if (!chartState) return;
      const bounds = canvas.getBoundingClientRect();
      dragStartX = event.clientX - bounds.left;
      dragCurrentX = dragStartX;
      canvas.setPointerCapture(event.pointerId);
      draw();
    }

    function handlePointerDrag(event) {
      if (dragStartX === null || !chartState) {
        handlePointerMove(event);
        return;
      }
      const bounds = canvas.getBoundingClientRect();
      dragCurrentX = event.clientX - bounds.left;
      draw();
    }

    function handlePointerUp(event) {
      if (dragStartX === null || !chartState) return;
      const bounds = canvas.getBoundingClientRect();
      const endX = event.clientX - bounds.left;
      const startIndex = rowIndexFromX(dragStartX);
      const endIndex = rowIndexFromX(endX);
      dragStartX = null;
      dragCurrentX = null;
      setDateRangeByIndexes(startIndex, endIndex);
    }

    function drawSelectionOverlay() {
      if (dragStartX === null || dragCurrentX === null || !chartState) return;
      const { pad, rect } = chartState;
      const left = Math.max(pad.left, Math.min(dragStartX, dragCurrentX));
      const right = Math.min(rect.width - pad.right, Math.max(dragStartX, dragCurrentX));
      ctx.save();
      ctx.fillStyle = "rgba(31, 111, 235, 0.16)";
      ctx.strokeStyle = "rgba(31, 111, 235, 0.7)";
      ctx.fillRect(left, pad.top, right - left, rect.height - pad.top - pad.bottom);
      ctx.strokeRect(left, pad.top, right - left, rect.height - pad.top - pad.bottom);
      ctx.restore();
    }

    symbolSelect.addEventListener("change", () => setRange("ALL"));
    watchToggle.addEventListener("click", () => toggleWatch(symbolSelect.value));
    startInput.addEventListener("change", draw);
    endInput.addEventListener("change", draw);
    window.addEventListener("resize", draw);
    canvas.addEventListener("mousemove", handlePointerMove);
    canvas.addEventListener("mouseleave", clearHover);
    canvas.addEventListener("wheel", handleWheel, { passive: false });
    canvas.addEventListener("pointerdown", handlePointerDown);
    canvas.addEventListener("pointermove", handlePointerDrag);
    canvas.addEventListener("pointerup", handlePointerUp);
    zoomInButton.addEventListener("click", () => zoomByFactor(0.75));
    zoomOutButton.addEventListener("click", () => zoomByFactor(1.35));
    zoomResetButton.addEventListener("click", resetZoom);
    rangeStartHandle.addEventListener("pointerdown", event => startRangeDrag("start", event));
    rangeEndHandle.addEventListener("pointerdown", event => startRangeDrag("end", event));
    rangeBar.addEventListener("pointermove", event => {
      if (activeRangeHandle) updateRangeFromHandle(event);
    });
    rangeBar.addEventListener("pointerup", stopRangeDrag);
    rangeBar.addEventListener("pointercancel", stopRangeDrag);
    document.querySelectorAll("button[data-range]").forEach(button => button.addEventListener("click", () => setRange(button.dataset.range)));
    setRange("ALL");
  </script>
</body>
</html>
